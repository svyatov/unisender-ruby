name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - run: bundle exec rake ci

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: false
      - name: Verify the release version
        run: ruby -Ilib -runisender/version -e 'abort "Tag and gem version differ" unless ENV.fetch("GITHUB_REF_NAME") == "v#{Unisender::VERSION}"'
      - run: mkdir -p pkg
      - run: gem build unisender.gemspec --output pkg/unisender-ruby.gem
      - name: Inventory the built gem
        run: ruby -rjson -r ./scripts/release_metadata -e 'puts JSON.pretty_generate(ReleaseMetadata.for_gem("pkg/unisender-ruby.gem"))' > pkg/sbom.spdx.json
      - name: Extract release notes
        run: ruby -r ./scripts/release_metadata -e 'puts ReleaseMetadata.notes(File.read("CHANGELOG.md"), ENV.fetch("GITHUB_REF_NAME"))' > pkg/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-build
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_GEMFILE: .github/release/Gemfile
      BUNDLE_PATH: vendor/publish
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-build
          path: pkg/
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: false
      - run: bundle install
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: bundle exec sigstore-cli sign pkg/unisender-ruby.gem --bundle pkg/unisender-ruby.gem.sigstore.json
      - run: gem push pkg/unisender-ruby.gem --attestation pkg/unisender-ruby.gem.sigstore.json

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-build
          path: pkg/
      - run: mv pkg/release-notes.md release-notes.md
      - name: Hash release assets
        working-directory: pkg
        run: sha256sum unisender-ruby.gem sbom.spdx.json > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: pkg/*
      - name: Publish the verified assets
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md pkg/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
